# Racial organ identities for surgery and diagnostic scanners.
# Parents preserve each species' existing physiology; these entities only make
# the implanted organ traceable to its donor species.

- type: entity
  id: OrganMothBrain
  parent: OrganHumanBrain
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Goobstation/Mobs/Species/Moth/organs.rsi
    state: brain
- type: entity
  id: OrganMothEyes
  parent: OrganHumanEyes
  categories: [ HideSpawnMenu ]
  components:
