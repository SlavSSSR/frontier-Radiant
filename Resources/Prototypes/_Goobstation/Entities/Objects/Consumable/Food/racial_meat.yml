# Racial meat from Goob Station PR #696.  Shared bases keep every variant
# mechanically identical to the upstream recipe while retaining its own sprite.
- type: entity
  abstract: true
  id: FoodRacialMeatRawBase
  parent: FoodMeatHuman
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Consumable/Food/meat.rsi

- type: entity
  abstract: true
  id: FoodRacialMeatCookedBase
  parent: FoodMeatCooked
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Consumable/Food/meat.rsi

- type: entity
  abstract: true
  id: FoodRacialCutletRawBase
  parent: FoodMeatBase
  components:
  - type: Tag
    tags: [Raw, Cutlet, Meat]
  - type: Sprite
    sprite: _Goobstation/Objects/Consumable/Food/meat.rsi
  - type: SolutionContainerManager
    solutions:
      food:
        reagents:
        - ReagentId: UncookedAnimalProteins
          Quantity: 3
        - ReagentId: Fat
          Quantity: 2

- type: entity
  abstract: true
  id: FoodRacialCutletCookedBase
  parent: FoodMeatBase
  components:
  - type: Tag
    tags: [Cooked, Cutlet, Meat]
  - type: Sprite
    sprite: _Goobstation/Objects/Consumable/Food/meat.rsi
  - type: SolutionContainerManager
    solutions:
      food:
        reagents:
        - ReagentId: Nutriment
          Quantity: 2
        - ReagentId: Protein
          Quantity: 2

# Vulpkanin
- type: entity
  parent: FoodRacialMeatRawBase
  id: FoodMeatVulpkanin
  name: raw vulpkanin meat
  components:
  - type: Sprite
    state: vulp
  - type: Construction
    graph: VulpkaninSteak
    node: start
    defaultTarget: steak
  - type: SliceableFood
    count: 3
    slice: FoodVulpkaninCutlet
- type: entity
  parent: FoodRacialMeatCookedBase
  id: FoodMeatCookedVulpkanin
  name: vulpkanin steak
  components:
  - type: Sprite
    layers:
    - state: vulp-cooked
  - type: SliceableFood
    count: 3
    slice: FoodVulpkaninCutletCooked
- type: entity
  parent: FoodRacialCutletRawBase
  id: FoodVulpkaninCutlet
  name: raw vulpkanin cutlet
  components:
  - type: Sprite
    state: vulp_cutlet
  - type: Construction
    graph: VulpkaninCutlet
    node: start
    defaultTarget: cutlet
- type: entity
  parent: FoodRacialCutletCookedBase
  id: FoodVulpkaninCutletCooked
  name: vulpkanin cutlet
  components:
  - type: Sprite
    state: vulp_cutlet-cooked
  - type: Construction
    graph: VulpkaninCutlet
    node: vulpkanin cutlet
  - type: FoodSequenceElement
    entries: { Burger: VulpkaninCutlet, Taco: VulpkaninCutlet }

