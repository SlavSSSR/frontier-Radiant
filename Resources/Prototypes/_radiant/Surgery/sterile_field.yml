    priority: -105
    steps: [SurgeryStepDrape]
  - type: SurgerySiteTreatment
    site: Surface
    treatment: Drape
  - type: Sprite
    sprite: _radiant/Objects/Medical/sterile_drape.rsi
    state: drape
    color: "#76C9CD"

