#region Base game vehicles
- type: entity
  parent: VehicleATV
  id: NFVehicleATV
  components:
  # --- ДОБАВЛЕНО ДЛЯ ПРИЦЕПОВ ---
  - type: Puller
    needsHands: false
  - type: ActivePuller
  # ------------------------------
  - type: Sprite
    sprite: _NF/Objects/Vehicles/atv.rsi
    layers:
    - state: hull
      map: [ "enum.DamageStateVisualLayers.Base" ]
    - state: engine
      map: ["enum.VehicleVisualLayers.AutoAnimate"]
    - state: lights
      shader: unshaded
    noRot: true
  - type: Vehicle
    renderOver: North, East, South, West # Frontier
    southOffset: 0, -0.1
    northOffset: 0, -0.1
    eastOffset: 0.05, -0.1
    westOffset: -0.05, -0.1
  - type: RandomSprite
    available:
      - enum.DamageStateVisualLayers.Base:
          hull: Sixteen # Rainbow, Emagged, Departmental, Advanced
  - type: ItemSlots
    slots:
      key_slot:
        name: vehicle-slot-component-slot-name-keys
        whitelist:
          requireAll: true
          tags:
          - VehicleKey
          - ATVKeys
        priority: 1
        insertSound:
          path: /Audio/Effects/Vehicle/vehiclestartup.ogg
          params:
            volume: -3
      bag:
        name: stored bag
        whitelist:
          components:
            - Storage
        priority: 2
        insertSound:
          path: /Audio/Items/belt_equip.ogg
          params:
            volume: -3
  - type: ItemMapper
    mapLayers:
      bag:
        whitelist:
          components:
            - Storage
    sprite: _NF/Objects/Vehicles/atv.rsi
  - type: UnpoweredFlashlight
  - type: PointLight
    enabled: false
    radius: 3.5
    softness: 2
    mask: /Textures/Effects/LightMasks/cone.png
    autoRot: true
  - type: RandomMetadata
    descriptionSegments: [DescriptionsATV]

#region skeleton bike
- type: entity
  parent: BaseVehicle
  id: NFVehicleSkeletonMotorcycle
  name: skeleton motorcycle
  description: Bad to the Bone.
  components:
    - type: Puller
      needsHands: false
    - type: ActivePuller
    - type: Vehicle
      renderOver: North, East, South, West
      southOffset: 0, -0.1
      northOffset: 0, -0.1
      eastOffset: 0.05, -0.1
      westOffset: -0.05, -0.1
      hornSound:
        collection: NFGuitarRiffs
    - type: Sprite
      sprite: Objects/Vehicles/motorbike.rsi
      layers:
        - state: vehicle
          map: ["enum.VehicleVisualLayers.AutoAnimate"]
      noRot: true
    - type: MovementSpeedModifier
      baseAcceleration: 2
      baseFriction: 1.5
      baseWalkSpeed: 4.5
      baseSprintSpeed: 7
    - type: UnpoweredFlashlight
    - type: PointLight
      enabled: false
      radius: 3.5
      softness: 2
      mask: /Textures/Effects/LightMasks/cone.png
      autoRot: true
    - type: ItemSlots
      slots:
        key_slot:
          name: vehicle-slot-component-slot-name-keys
          whitelist:
            requireAll: true
            tags:
              - VehicleKey
              - SkeletonMotorcycleKeys
          insertSound:
            path: /Audio/Effects/Vehicle/vehiclestartup.ogg
            params:
              volume: -3
    - type: Storage
      grid:
      - 0,0,1,3
      - 3,0,6,3
      - 8,0,9,3
      maxItemSize: Huge
      blacklist:
        components:
        - HumanoidAppearance
    - type: ContainerContainer
      containers:
        storagebase: !type:Container
    - type: UserInterface
      interfaces:
        enum.StorageUiKey.Key:
          type: StorageBoundUserInterface

#region unicycle
- type: entity
  id: VehicleUnicycle
  parent: [BaseVehicle, BaseFoldable, BaseItem]
  name: unicycle
  description: It only has one wheel!
  components:
  - type: Vehicle
    renderOver: None
    northOffset: 0, -0.15
    southOffset: 0, -0.15
    eastOffset: 0, -0.15
    westOffset: 0, -0.15
    engineRunning: true
    hornSound:
      collection: BikeHorn
      params:
        variation: 0.125
  - type: Sprite
    sprite: Objects/Vehicles/unicycle.rsi
    layers:
    - state: vehicle
      map: ["enum.VehicleVisualLayers.AutoAnimate", "unfoldedLayer"]
    - state: vehicle_folded
      map: ["foldedLayer"]
      visible: false
    noRot: true
  - type: MovementSpeedModifier
    baseAcceleration: 1
    baseFriction: 0.8
    baseWalkSpeed: 3.5
    baseSprintSpeed: 4.3
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 240
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: ItemSlots
    slots: {} # no keys required

- type: entity
  parent: VehicleUnicycle
  id: VehicleUnicycleFolded
  suffix: folded
  components:
  - type: Foldable
    folded: true

- type: entity
  id: VehicleJanicartDestroyed
  parent: MachineFrameDestroyed
  name: destroyed janicart
  components:
  - type: Sprite
    sprite: Objects/Vehicles/janicart.rsi
    state: destroyed

#region hoverbike
- type: entity
  parent: NFVehicleATV
  id: NFVehicleHoverbike
  name: hoverbike
  description: A turbine with bike handles. Very safe.
  components:
  - type: MovementIgnoreGravity
  - type: MovementAlwaysTouching
  - type: CanMoveInAir
  - type: Puller
    needsHands: false
  - type: ActivePuller # Добавлено для полной совместимости расчета скорости
  - type: AmbientSound
    sound: /Audio/Effects/shuttle_thruster.ogg
    range: 8
    volume: 5
    enabled: false
  - type: MovementSpeedModifier
    baseAcceleration: 1.7
    baseFriction: 0.6
    baseWalkSpeed: 4.3
    baseSprintSpeed: 8
  - type: Sprite
    sprite: _NF/Objects/Vehicles/hoverbike.rsi
    layers:
    - state: hull
      map: [ "enum.DamageStateVisualLayers.Base" ]
    - state: engine
      map: ["enum.VehicleVisualLayers.AutoAnimate"]
    - state: lights
      shader: unshaded
    noRot: true
  - type: RandomSprite
    available:
      - enum.DamageStateVisualLayers.Base:
          hull: Sixteen # Rainbow, Emagged, Departmental, Advanced
  - type: ItemSlots
    slots:
      key_slot:
        name: vehicle-slot-component-slot-name-keys
        whitelist:
          requireAll: true
          tags:
          - VehicleKey
          - HoverbikeKeys
        priority: 1
        insertSound:
          path: /Audio/Effects/Vehicle/vehiclestartup.ogg
          params:
            volume: -5
      bag:
        name: stored bag
        whitelist:
          components:
            - Storage
        priority: 2
        insertSound:
          path: /Audio/Items/belt_equip.ogg
          params:
            volume: -3
  - type: ItemMapper
    mapLayers:
      bag:
        whitelist:
          components:
            - Storage
    sprite: _NF/Objects/Vehicles/hoverbike.rsi
  - type: Appearance
  - type: PointLight
    radius: 7
    energy: 3

- type: entity
  parent: NFVehicleHoverbike
  id: NFVehicleHoverbikeKeys
  suffix: With key
  # Компоненты пуллера наследуются автоматически от родительского NFVehicleHoverbike
  components:
  - type: ItemSlots
    slots:
      key_slot:
        name: vehicle-slot-component-slot-name-keys
        whitelist:
          requireAll: true
          tags:
          - VehicleKey
          - HoverbikeKeys
        startingItem: VehicleKeyHoverbikeNF
        priority: 1
        insertSound:
          path: /Audio/Effects/Vehicle/vehiclestartup.ogg
          params:
            volume: -5
      bag:
        name: stored bag
        whitelist:
          components:
            - Storage
        priority: 2
        insertSound:
          path: /Audio/Items/belt_equip.ogg
          params:
            volume: -3

#region janicart
# Enhanced version of the vanilla Janicart that adds a bucket and mop slot.
- type: entity
  id: NFVehicleJanicart
  parent: VehicleJanicart
  components:
  - type: Puller
    needsHands: false
  - type: ActivePuller # Добавлено для корректной работы системных событий
  - type: ItemSlots
    slots:
      key_slot:
        name: vehicle-slot-component-slot-name-keys
        whitelist:
          requireAll: true
          tags:
          - VehicleKey
          - JanicartKeys
        insertSound:
          path: /Audio/Effects/Vehicle/vehiclestartup.ogg
          params:
            volume: -3
        priority: 10
      mop_slot: &mopSlot
        name: janitorial-trolley-slot-component-slot-name-mop
        whitelist:
